[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-research-engine"
version = "2.0.0"
description = "Evidence-first autonomous deep research engine with strict fail-closed verification"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Deep Research Architecture Team" }
]
dependencies = [
    "ddgs>=9.0.0",
    "httpx>=0.27.0",
    "trafilatura>=2.0.0",
    "groq>=0.30.0",
    "tenacity>=8.2.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.35.0",
]

[project.scripts]
deep-research = "cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["research_engine*"]

